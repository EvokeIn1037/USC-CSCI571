<button type="button" class="close" aria-label="Close" (click)="closeModal()">
    <span aria-hidden="true">&times;</span>
</button>
<h1 mat-dialog-title>{{ data.source }}</h1>
<p>{{ data.datetime | date:'longDate' }}</p>
<hr class="w-100 mt-3 mb-3">
<mat-dialog-content>
    <h2>{{ data.headline }}</h2>
    <p>{{ data.summary }}</p>
    <span class="text-secondary">For more details click <a [href]="data.url" target="_blank">here</a></span>
    <div class="border border-gray rounded-lg p-3 d-flex flex-column align-items-left mt-5">
        <h4 class="mt-1">Share</h4>
        <div class="mt-2 mb-1 d-flex flex-row">
            <div class="mr-1">
                <a
                    href="https://twitter.com/intent/tweet?original_referer=https%3A%2F%2Fdeveloper.twitter.com%2F&ref_src=twsrc%5Etfw%7Ctwcamp%5Ebuttonembed%7Ctwterm%5Eshare%7Ctwgr%5E&text={{ data.headline }}&url={{ data.url }}"><i
                        class="bi bi-twitter img-thumbnail app-icon"></i></a>

            </div>
            <div class="fb-share-button ml-1" data-href="https://developers.facebook.com/docs/plugins/" data-layout=""
                data-size="">
                <a target="_blank" href="https://www.facebook.com/sharer/sharer.php?u={{ data.url }}"
                    class="fb-xfbml-parse-ignore"><i class="bi bi-facebook img-thumbnail app-icon"></i></a>
            </div>
        </div>
    </div>

</mat-dialog-content>
